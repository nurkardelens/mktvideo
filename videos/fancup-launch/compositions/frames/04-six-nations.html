<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>04 — Six Nations, Six Playstyles</title>
  </head>
  <body>
    <template>
      <style>
        @font-face{font-family:"Archivo Black";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/ArchivoBlack-Regular.woff2") format("woff2");}
        @font-face{font-family:"Space Grotesk";font-weight:400 700;font-style:normal;font-display:block;src:url("assets/fonts/SpaceGrotesk-Variable.woff2") format("woff2");}
        @font-face{font-family:"JetBrains Mono";font-weight:400 500;font-style:normal;font-display:block;src:url("assets/fonts/JetBrainsMono-Variable.woff2") format("woff2");}

        #root {
          position: relative;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
          background: #0b0b0d;
          font-family: "Space Grotesk", sans-serif;
        }

        .clip {
          position: absolute;
        }

        /* Scene 1 — mono kicker, top-left inset */
        #kicker {
          top: 64px;
          left: 96px;
          z-index: 1;
          font-family: "JetBrains Mono", monospace;
          font-size: 26px;
          font-weight: 500;
          letter-spacing: 0.14em;
          text-transform: uppercase;
          color: #ffffff;
          opacity: 0;
        }

        /* Scene 2 — roster screenshot, cream-bordered flat card, right ~65% */
        #card-wrap {
          top: 231px;
          right: 64px;
          width: 1250px;
          z-index: 2;
          opacity: 0;
        }
        #card {
          width: 100%;
          aspect-ratio: 2816 / 1394;
          border: 6px solid #ffffff;
          background: #0b0b0d;
          box-sizing: border-box;
          overflow: hidden;
        }
        #card img {
          display: block;
          width: 100%;
          height: 100%;
          object-fit: cover;
        }
        /* foreground flat-border accent — the third depth layer */
        .corner-h,
        .corner-v {
          position: absolute;
          background: #00e5ff;
          z-index: 3;
          opacity: 0;
        }
        .corner-h {
          top: -14px;
          right: -6px;
          width: 64px;
          height: 4px;
          transform-origin: right center;
        }
        .corner-v {
          top: -6px;
          right: -14px;
          width: 4px;
          height: 64px;
          transform-origin: top center;
        }

        /* Scene 3 — headline, left third */
        #headline {
          top: 380px;
          left: 96px;
          z-index: 4;
          width: 480px;
        }
        .line {
          font-family: "Archivo Black", sans-serif;
          font-size: 58px;
          line-height: 0.92;
          letter-spacing: -0.01em;
          text-transform: uppercase;
          color: #ffffff;
        }
        .line + .line {
          margin-top: 22px;
        }
        .line-accent {
          color: #e8113c;
          opacity: 0;
        }
        .word {
          display: inline-block;
          opacity: 0;
        }
      </style>

      <div id="root" data-composition-id="04-six-nations" data-width="1920" data-height="1080" data-duration="4">
        <div id="kicker" class="clip" data-start="0" data-duration="4" data-track-index="1">
          CHILIZ NATIONS CUP &middot; ROSTER
        </div>

        <div id="card-wrap" class="clip" data-start="0" data-duration="4" data-track-index="2">
          <div id="card">
            <img src="assets/roster.png" alt="FanCup National Teams roster screen" />
          </div>
          <div class="corner-h"></div>
          <div class="corner-v"></div>
        </div>

        <div id="headline" class="clip" data-start="0" data-duration="4" data-track-index="3">
          <div class="line" id="line1"><span class="word" id="w1">SIX</span> <span class="word" id="w2">NATIONS.</span></div>
          <div class="line line-accent" id="line2">SIX PLAYSTYLES.</div>
        </div>
      </div>

      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // Scene 1 (0.0-1.4s): mono kicker fades in top-left, nothing else on screen.
        tl.fromTo(
          "#kicker",
          { opacity: 0, y: 14 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
          0.2
        );

        // Scene 2 (1.4-2.6s): roster screenshot slides in from the right edge and settles.
        // Surface establish: edge slide-in + settle, power3, no bounce.
        tl.fromTo(
          "#card-wrap",
          { x: 460, opacity: 0 },
          { x: 0, opacity: 1, duration: 1.0, ease: "power3.out" },
          1.4
        );

        // Foreground flat-border accent completes the surface establish (3rd depth layer).
        tl.fromTo("#card-wrap .corner-h", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.32, ease: "power3.out" }, 2.15);
        tl.fromTo("#card-wrap .corner-v", { scaleY: 0, opacity: 0 }, { scaleY: 1, opacity: 1, duration: 0.32, ease: "power3.out" }, 2.15);

        // Scene 3 (2.6-4.0s): "SIX NATIONS." lands via per-word staggered reveal
        // (dynamic-content-sequencing: pre-computed per-item start offsets from a content array).
        const WORDS = [
          { id: "#w1", start: 2.6 },
          { id: "#w2", start: 2.75 },
        ];
        WORDS.forEach((w) => {
          tl.fromTo(
            w.id,
            { opacity: 0, y: 26 },
            { opacity: 1, y: 0, duration: 0.42, ease: "power3.out" },
            w.start
          );
        });

        // "SIX PLAYSTYLES." lands beneath it 0.5s after line 1 begins, in orange.
        tl.fromTo(
          "#line2",
          { opacity: 0, y: 26 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
          2.6 + 0.5
        );

        // Holds for the remainder; only subtle non-repeating jitter keeps the card alive.
        tl.to("#card-wrap", { y: -3, duration: 0.18, ease: "sine.inOut" }, 3.65);
        tl.to("#card-wrap", { y: 0, duration: 0.17, ease: "sine.inOut" }, 3.83);

        window.__timelines["04-six-nations"] = tl;
      </script>
    </template>
  </body>
</html>
