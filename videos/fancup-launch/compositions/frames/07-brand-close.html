<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>07 Brand Close</title>
    <!-- head is metadata only for the source file; the runtime discards everything
         outside <template> — see hyperframes-core/references/sub-compositions.md -->
  </head>
  <body>
    <template>
      <style>
        @font-face{font-family:"Archivo Black";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/ArchivoBlack-Regular.woff2") format("woff2");}
        @font-face{font-family:"Space Grotesk";font-weight:400 700;font-style:normal;font-display:block;src:url("assets/fonts/SpaceGrotesk-Variable.woff2") format("woff2");}
        @font-face{font-family:"JetBrains Mono";font-weight:400 500;font-style:normal;font-display:block;src:url("assets/fonts/JetBrainsMono-Variable.woff2") format("woff2");}

        /* Root: styled by #root, never a class — see sub-compositions.md Pitfall 3 */
        #root {
          position: relative;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
          font-family: "Space Grotesk", sans-serif;
        }

        /* Full-bleed ground on its own class="clip" layer, never #root itself.
           This is the single reserved dark-cyan closing-plate hue of the whole
           video — a hard ground-swap cut, not a crossfade. */
        .bg-ground {
          position: absolute;
          inset: 0;
          background: #0098a9;
        }

        /* Centered vertical stack: wordmark -> tagline -> CTA rail.
           Stack height (~400px) sits well inside the 83% keep-out line. */
        .stage {
          position: absolute;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
        }

        /* Soft cream halo behind the wordmark. Invisible until the draw
           settles (t=3.0s), then carries the frame's one "subtle jitter". */
        .wordmark-glow {
          position: absolute;
          left: 50%;
          top: 50%;
          width: 760px;
          height: 300px;
          margin-left: -380px;
          margin-top: -150px;
          border-radius: 50%;
          background: radial-gradient(
            circle,
            rgba(255, 255, 255, 0.55) 0%,
            rgba(255, 255, 255, 0.18) 42%,
            rgba(255, 255, 255, 0) 72%
          );
          filter: blur(30px);
          opacity: 0;
          will-change: opacity, transform;
        }

        .wordmark-svg {
          position: relative;
          width: 960px;
          height: 200.9px;
          display: block;
          overflow: visible;
        }

        .wordmark-letter {
          fill: none;
          stroke: #ffffff;
          stroke-width: 9;
          stroke-linecap: round;
          stroke-linejoin: round;
          /* strokeDasharray / strokeDashoffset assigned at runtime from
             getTotalLength() — see script below. */
        }

        .tagline {
          margin-top: 34px;
          font-family: "Space Grotesk", sans-serif;
          font-weight: 600;
          font-size: 42px;
          line-height: 1.2;
          color: #0b0b0d;
          text-align: center;
        }

        .cta-rail {
          margin-top: 40px;
          display: inline-flex;
          align-items: center;
          padding: 20px 40px;
          background: rgba(11, 11, 13, 0.82);
          border: 2px solid #ffffff;
          border-radius: 999px;
          transform-origin: 50% 50%;
          will-change: transform, opacity;
        }

        .cta-text {
          font-family: "JetBrains Mono", monospace;
          font-weight: 500;
          font-size: 27px;
          letter-spacing: 0.08em;
          text-transform: uppercase;
          color: #ffffff;
          white-space: nowrap;
        }

        /* The one true exit of the whole video: settle, then fade to black. */
        .exit-fade {
          position: absolute;
          inset: 0;
          background: #000000;
        }
      </style>

      <div
        id="root"
        data-composition-id="07-brand-close"
        data-width="1920"
        data-height="1080"
        data-duration="6"
      >
        <div id="bg-ground" class="clip bg-ground" data-start="0" data-duration="6" data-track-index="0"></div>

        <div id="stage" class="clip stage" data-start="0" data-duration="6" data-track-index="1">
          <div id="wordmark-glow" class="wordmark-glow"></div>

          <svg
            id="wordmark-svg"
            class="wordmark-svg"
            viewBox="0 0 430 90"
            xmlns="http://www.w3.org/2000/svg"
          >
            <!-- F -->
            <g transform="translate(0,0)">
              <path class="wordmark-letter" id="ltr-f" d="M12,88 L12,4 M12,4 L48,4 M12,46 L40,46" />
            </g>
            <!-- A -->
            <g transform="translate(74,0)">
              <path class="wordmark-letter" id="ltr-a" d="M6,88 L30,4 L54,88 M16,56 L44,56" />
            </g>
            <!-- N -->
            <g transform="translate(148,0)">
              <path class="wordmark-letter" id="ltr-n" d="M10,88 L10,4 M10,4 L50,88 M50,88 L50,4" />
            </g>
            <!-- C -->
            <g transform="translate(222,0)">
              <path class="wordmark-letter" id="ltr-c" d="M46,6 A30,41 0 1 0 46,86" />
            </g>
            <!-- U -->
            <g transform="translate(296,0)">
              <path class="wordmark-letter" id="ltr-u" d="M12,4 L12,58 A18,26 0 0 0 48,58 L48,4" />
            </g>
            <!-- P -->
            <g transform="translate(370,0)">
              <path class="wordmark-letter" id="ltr-p" d="M12,88 L12,4 M12,4 L36,4 A17,17 0 1 1 36,38 L12,38" />
            </g>
          </svg>

          <div id="tagline" class="tagline">Season I is live.</div>

          <div id="cta-rail" class="cta-rail">
            <span class="cta-text">fancup.trenchroyale.com</span>
          </div>
        </div>

        <div id="exit-fade" class="clip exit-fade" data-start="5.3" data-duration="0.7" data-track-index="2"></div>
      </div>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};

        // ── Setup: measure each wordmark letter's stroke path and prime it
        // invisible (dash pattern = one dash the full length, offset out of
        // view). Mirrors the svg-path-draw rule's canonical setup. ──
        const letters = document.querySelectorAll(".wordmark-letter");
        letters.forEach((p) => {
          const len = p.getTotalLength();
          p.style.strokeDasharray = `${len}`;
          p.style.strokeDashoffset = `${len}`;
        });

        const glow = document.getElementById("wordmark-glow");
        const tagline = document.getElementById("tagline");
        const taglineText = tagline;
        const cta = document.getElementById("cta-rail");
        const exitFade = document.getElementById("exit-fade");

        const tl = gsap.timeline({ paused: true });

        // ── Scene 1 (0.0–1.2s) ────────────────────────────────────────────
        // Hard ground-swap cut lands the frame on the reserved dark-cyan
        // closing plate. Nothing else happens — the stage sits empty on the
        // one distinct hue of the whole video before the mark builds.
        // (.bg-ground is present for the whole 6s window; no tween needed.)

        // ── Scene 2 (1.2–3.0s) ────────────────────────────────────────────
        // FANCUP wordmark draws itself on, stroke-by-stroke, left to right.
        // Each letter's dashoffset animates length -> 0. 70% stagger keeps
        // the six letters reading as one continuous stroke, not six
        // isolated draws (svg-path-draw rule). power2.out — a pen lifting,
        // never back.out/elastic.out.
        const DRAW_DUR = 0.4;
        const STAGGER = 0.28;
        const DRAW_START = 1.2;
        const letterIds = ["#ltr-f", "#ltr-a", "#ltr-n", "#ltr-c", "#ltr-u", "#ltr-p"];
        letterIds.forEach((sel, i) => {
          tl.to(
            sel,
            { strokeDashoffset: 0, duration: DRAW_DUR, ease: "power2.out" },
            DRAW_START + i * STAGGER,
          );
        });
        // last letter starts at 2.60, finishes at 3.00 — lands exactly on
        // the Scene 2 -> Scene 3 boundary.

        // Wordmark glow ignites right as the draw settles, then carries a
        // low-amplitude sine jitter (sine-wave-loop rule, LOW end of the
        // amplitude range) until the exit fade begins at 5.3s.
        tl.fromTo(
          glow,
          { opacity: 0, scale: 0.9 },
          { opacity: 0.24, scale: 1, duration: 0.4, ease: "power2.out" },
          3.0,
        );
        const glowPhase = { p: 0 };
        const GLOW_IDLE_START = 3.4; // sin(0)=0 here => matches the ignite's resting state, no jump
        const GLOW_IDLE_DUR = 5.3 - GLOW_IDLE_START;
        tl.to(
          glowPhase,
          {
            p: Math.PI * 2 * 1, // one full breath across the idle window
            duration: GLOW_IDLE_DUR,
            ease: "none",
            onUpdate: () => {
              const s = 1 + Math.sin(glowPhase.p) * 0.015;
              const o = 0.24 + Math.sin(glowPhase.p) * 0.05;
              glow.style.transform = `scale(${s})`;
              glow.style.opacity = o;
            },
          },
          GLOW_IDLE_START,
        );

        // ── Scene 3 (3.0–4.4s) ────────────────────────────────────────────
        // "Season I is live." fades in beneath the wordmark, ink-on-green.
        // Container fade (the "fades in" beat) + a discrete two-step text
        // build (discrete-text-sequence's threshold-array mechanic) so the
        // line lands in one bulk addition rather than a hard instant swap.
        tl.fromTo(tagline, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, 3.0);

        const TAGLINE_SEQUENCE = [
          { t: 0.0, text: "" },
          { t: 0.2, text: "Season I" },
          { t: 0.5, text: "Season I is live." },
        ];
        function taglineAt(localT) {
          for (let i = TAGLINE_SEQUENCE.length - 1; i >= 0; i--) {
            if (localT >= TAGLINE_SEQUENCE[i].t) return TAGLINE_SEQUENCE[i].text;
          }
          return "";
        }
        const taglineDriver = { t: 0 };
        tl.to(
          taglineDriver,
          {
            t: 3.0, // enough headroom past the 0.5s build window
            duration: 3.0,
            ease: "none",
            onUpdate: () => {
              taglineText.textContent = taglineAt(taglineDriver.t);
            },
          },
          3.0,
        );

        // ── Scene 4 (4.4–6.0s) ────────────────────────────────────────────
        // Mono CTA rail settles in as a pill badge — spring-pop-entrance,
        // smooth long-tail power3.out, no overshoot — holds, then this
        // frame's one true exit: a settle-and-fade to black at the very end.
        tl.fromTo(
          cta,
          { scale: 0, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.6, ease: "power3.out" },
          4.4,
        );
        // Holds from 5.0s to 5.3s, then the exit fade takes over.

        tl.fromTo(
          exitFade,
          { opacity: 0 },
          { opacity: 1, duration: 0.7, ease: "power2.in" },
          5.3,
        );

        window.__timelines["07-brand-close"] = tl;
      </script>
    </template>
  </body>
</html>
