<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>03 Reveal</title>
    <!-- head is metadata only for the source file; the runtime discards everything
         outside the template element — see hyperframes-core/references/sub-compositions.md -->
  </head>
  <body>
    <template>
      <style>
        @font-face{font-family:"Archivo Black";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/ArchivoBlack-Regular.woff2") format("woff2");}
        @font-face{font-family:"Space Grotesk";font-weight:400 700;font-style:normal;font-display:block;src:url("assets/fonts/SpaceGrotesk-Variable.woff2") format("woff2");}
        @font-face{font-family:"JetBrains Mono";font-weight:400 500;font-style:normal;font-display:block;src:url("assets/fonts/JetBrainsMono-Variable.woff2") format("woff2");}
        @font-face{font-family:"Inter";font-weight:400 800;font-style:normal;font-display:block;src:url("assets/fonts/Inter-Variable.woff2") format("woff2");}

        /* Root: styled by #root, never a class — see sub-compositions.md Pitfall 3 */
        #root {
          position: relative;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
        }

        /* Full-bleed ground lives on its own class="clip" layer, never on #root itself. */
        .void-bg {
          position: absolute;
          inset: 0;
          background: #0b0b0d;
        }

        /* ---- Scene 1 (0.0-1.2s): this video's own shard-collision shell,
           continuing Frame 2's converge — ignites into the flash that hands
           off to the REAL brand mark. Shards keep this video's invented
           cyan/red palette; only the mark itself carries its real colors. ---- */
        .shard-field {
          position: absolute;
          inset: 0;
        }
        .shard {
          position: absolute;
          left: 50%;
          top: 50%;
          width: 44px;
          height: 44px;
          margin-left: -22px;
          margin-top: -22px;
          border-radius: 4px;
          opacity: 0;
          will-change: transform, opacity;
        }
        .shard-cyan {
          background: #00e5ff;
          box-shadow: 0 0 22px rgba(0, 229, 255, 0.7);
        }
        .shard-red {
          background: #e8113c;
          box-shadow: 0 0 22px rgba(232, 17, 60, 0.7);
        }

        .flash {
          position: absolute;
          left: 50%;
          top: 50%;
          width: 900px;
          height: 900px;
          margin-left: -450px;
          margin-top: -450px;
          border-radius: 50%;
          background: radial-gradient(
            circle,
            #ffffff 0%,
            #00e5ff 36%,
            rgba(0, 229, 255, 0) 70%
          );
          opacity: 0;
          will-change: transform, opacity;
        }

        /* ---- Scene 2 + 3: the REAL fancup mark, kept inside the 83%
           caption keep-out. Real lime-green icon + white Inter wordmark —
           NOT recolored into this video's cyan/red shell. ---- */
        .mark-stack {
          position: absolute;
          inset: 0;
        }
        .stage {
          position: absolute;
          left: 0;
          right: 0;
          top: 0;
          height: 896px; /* 0.83 * 1080 — caption keep-out boundary */
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 44px;
        }

        .lockup {
          position: relative;
          display: flex;
          align-items: center;
          gap: 26px;
        }
        .icon-wrap {
          position: relative;
          width: 84px;
          height: 84px;
          flex: none;
        }
        .icon-glow {
          position: absolute;
          left: 50%;
          top: 50%;
          width: 220px;
          height: 220px;
          margin-left: -110px;
          margin-top: -110px;
          border-radius: 50%;
          background: radial-gradient(
            circle,
            rgba(139, 198, 63, 0.55) 0%,
            rgba(139, 198, 63, 0.18) 45%,
            rgba(139, 198, 63, 0) 72%
          );
          opacity: 0;
          z-index: 0;
          pointer-events: none;
          will-change: opacity;
        }
        .ball-svg {
          position: relative;
          z-index: 1;
          display: block;
          width: 84px;
          height: 84px;
        }
        .wordmark {
          position: relative;
          display: flex;
          font-family: "Inter", sans-serif;
          font-weight: 800;
          font-size: 130px;
          line-height: 1;
          letter-spacing: -0.02em;
          color: #ffffff;
        }
        .letter {
          display: inline-block;
          transform-origin: 50% 50%;
          will-change: transform, opacity;
        }

        .headline {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 8px;
          font-family: "Inter", sans-serif;
          font-weight: 700;
          font-size: 58px;
          line-height: 1.25;
          text-align: center;
        }
        .hline {
          display: flex;
          gap: 16px;
          justify-content: center;
        }
        .hword {
          display: inline-block;
          color: #ffffff;
          opacity: 0;
          will-change: transform, opacity;
        }
        .hword.solana {
          background: linear-gradient(90deg, #9945ff 0%, #14f195 100%);
          -webkit-background-clip: text;
          background-clip: text;
          color: transparent;
        }
        .hword.chiliz {
          color: #e8113c;
        }
      </style>

      <div id="root" data-composition-id="03-reveal" data-width="1920" data-height="1080" data-duration="5.5">
        <div id="ground" class="clip void-bg" data-start="0" data-duration="5" data-track-index="0"></div>

        <div id="shard-field" class="clip shard-field" data-start="0" data-duration="1.2" data-track-index="1">
          <div class="shard shard-cyan" id="shard-1"></div>
          <div class="shard shard-red" id="shard-2"></div>
          <div class="shard shard-cyan" id="shard-3"></div>
          <div class="shard shard-red" id="shard-4"></div>
          <div class="shard shard-cyan" id="shard-5"></div>
          <div class="shard shard-red" id="shard-6"></div>
        </div>

        <div id="flash" class="clip flash" data-start="0" data-duration="1.4" data-track-index="2"></div>

        <div id="mark-stack" class="clip mark-stack" data-start="0" data-duration="5" data-track-index="3">
          <div class="stage">
            <div class="lockup" id="lockup">
              <div class="icon-wrap" id="icon-wrap">
                <div class="icon-glow" id="icon-glow"></div>
                <svg class="ball-svg" viewBox="0 0 84 84" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                  <defs>
                    <clipPath id="ball-clip"><circle cx="42" cy="42" r="42" /></clipPath>
                  </defs>
                  <circle cx="42" cy="42" r="42" fill="#8bc63f" />
                  <g clip-path="url(#ball-clip)" fill="#12210f">
                    <polygon points="42,29 54.36,37.98 49.64,52.51 34.36,52.51 29.64,37.98" />
                    <polygon points="18,10 25.61,15.53 22.70,24.47 13.30,24.47 10.39,15.53" />
                    <polygon points="64,53 70.66,57.84 68.12,65.66 59.88,65.66 57.34,57.84" />
                    <path d="M42,29 Q30,22 18,18" stroke="#12210f" stroke-width="2.4" fill="none" stroke-linecap="round" />
                    <path d="M49.64,52.51 Q58,58 64,60" stroke="#12210f" stroke-width="2.4" fill="none" stroke-linecap="round" />
                  </g>
                </svg>
              </div>

              <div class="wordmark" id="wordmark">
                <span class="letter" data-letter="0">f</span>
                <span class="letter" data-letter="1">a</span>
                <span class="letter" data-letter="2">n</span>
                <span class="letter" data-letter="3">c</span>
                <span class="letter" data-letter="4">u</span>
                <span class="letter" data-letter="5">p</span>
              </div>
            </div>

            <div class="headline" id="headline">
              <div class="hline hline-1">
                <span class="hword solana" data-hword="w1">Solana</span>
                <span class="hword" data-hword="w2">and</span>
                <span class="hword chiliz" data-hword="w3">Chiliz,</span>
              </div>
              <div class="hline hline-2">
                <span class="hword" data-hword="w4">on</span>
                <span class="hword" data-hword="w5">the</span>
                <span class="hword" data-hword="w6">same</span>
                <span class="hword" data-hword="w7">pitch.</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <script src="assets/vendor/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // ── Scene 1 (0.0-1.2s): SHARD COLLIDE + IGNITE ──────────────────
        // Picks up Frame 2's zoom-through seam: shards arrive already
        // converged near center (rising velocity, per 02-escalation's
        // Scene 3), collide in a quick shock-expand, then implode into the
        // ignition flash that resolves into the real mark.
        const shards = gsap.utils.toArray(".shard");
        const SHARD_START_SPREAD = [
          { x: 14, y: -8 },
          { x: -10, y: 12 },
          { x: 9, y: 10 },
          { x: -13, y: -7 },
          { x: 6, y: -13 },
          { x: -8, y: 9 },
        ];
        shards.forEach((el, i) => {
          const s = SHARD_START_SPREAD[i];
          // From-state matches the prior frame's converge end (scale ~1.22,
          // opacity 1, tight cluster) so the cut reads continuous.
          tl.fromTo(
            el,
            { x: s.x, y: s.y, scale: 1.22, opacity: 1 },
            { x: s.x * 2.6, y: s.y * 2.6, scale: 1.55, duration: 0.12, ease: "power2.out" },
            0,
          );
          tl.to(
            el,
            { x: 0, y: 0, scale: 0, opacity: 0, duration: 0.3, ease: "power3.in" },
            0.12,
          );
        });

        const flash = document.getElementById("flash");
        tl.fromTo(
          flash,
          { opacity: 0, scale: 0.3 },
          { opacity: 1, scale: 1.5, duration: 0.32, ease: "expo.out" },
          0.1,
        );
        tl.to(flash, { opacity: 0, scale: 2.3, duration: 0.62, ease: "power2.out" }, 0.5);

        // ── Scene 2 (1.2-2.4s): THE REAL MARK ASSEMBLES ────────────────
        // logo-assemble-lockup, Product_Intro variant, adapted: the
        // "assembling elements" are Frame 2's shards handing off into a
        // fixed, centered lockup — no orbit, no camera tilt. Icon pops
        // first (spring-pop-entrance, smooth power3 settle, no overshoot),
        // then the lowercase wordmark cascades in letter-by-letter beside it.
        const ICON_POP_START = 1.2;
        const ICON_POP_DUR = 0.42;
        const iconWrap = document.getElementById("icon-wrap");
        const iconGlow = document.getElementById("icon-glow");

        tl.fromTo(
          iconWrap,
          { scale: 0, opacity: 0 },
          { scale: 1, opacity: 1, duration: ICON_POP_DUR, ease: "power3.out" },
          ICON_POP_START,
        );
        tl.fromTo(
          iconGlow,
          { opacity: 0, scale: 0.8 },
          { opacity: 0.4, scale: 1, duration: 0.5, ease: "power2.out" },
          ICON_POP_START,
        );

        const WORDMARK_START = 1.35;
        const LETTER_POP_DUR = 0.45;
        const LETTER_STAGGER = 0.06; // 6 letters * 0.06 = 0.36s, inside the ~0.5s cap
        const letters = gsap.utils.toArray(".letter");
        letters.forEach((el, i) => {
          tl.fromTo(
            el,
            { scale: 0, opacity: 0, y: 16 },
            { scale: 1, opacity: 1, y: 0, duration: LETTER_POP_DUR, ease: "power3.out" },
            WORDMARK_START + i * LETTER_STAGGER,
          );
        });

        // ── Scene 3 (2.4-5.0s): REAL HEADLINE, TWO STAGGERED WAVES ──────
        // dynamic-content-sequencing vocabulary applied at word granularity:
        // a precomputed per-word start schedule, dispatched from a single
        // driver tween (no per-word GSAP tweens). Wave 1 = line 1
        // ("Solana and Chiliz,"), wave 2 = line 2 ("on the same pitch."),
        // ~0.6s apart, then held for the remainder of the frame.
        const HEADLINE_WORDS = [
          { key: "w1", start: 2.4 },
          { key: "w2", start: 2.5 },
          { key: "w3", start: 2.6 },
          { key: "w4", start: 3.0 },
          { key: "w5", start: 3.08 },
          { key: "w6", start: 3.16 },
          { key: "w7", start: 3.24 },
        ];
        const WORD_REVEAL_DUR = 0.35;
        const hwordEls = {};
        document.querySelectorAll(".hword").forEach((el) => {
          hwordEls[el.dataset.hword] = el;
        });
        function easeOutCubic(p) {
          return 1 - Math.pow(1 - p, 3);
        }

        const TOTAL_DURATION = 5;
        const driver = { t: 0 };
        tl.to(
          driver,
          {
            t: TOTAL_DURATION,
            duration: TOTAL_DURATION,
            ease: "none",
            onUpdate: () => {
              HEADLINE_WORDS.forEach((w) => {
                const el = hwordEls[w.key];
                const p = Math.min(Math.max((driver.t - w.start) / WORD_REVEAL_DUR, 0), 1);
                const eased = easeOutCubic(p);
                gsap.set(el, { opacity: eased, y: (1 - eased) * 16 });
              });
            },
          },
          0,
        );

        // ── Post-settle idle (2.4-5.0s): subtle jitter on the icon's glow
        // only — no breathing on the mark's scale/position anywhere. ──────
        const IDLE_START = 2.4;
        const IDLE_DUR = TOTAL_DURATION - IDLE_START;
        const CYCLES = 1.2;
        const GLOW_BASE_OPACITY = 0.4;
        const GLOW_AMP = 0.05;
        const phase = { p: 0 };
        tl.to(
          phase,
          {
            p: Math.PI * 2 * CYCLES,
            duration: IDLE_DUR,
            ease: "none",
            onUpdate: () => {
              const jitter = Math.sin(phase.p) * GLOW_AMP;
              gsap.set(iconGlow, { opacity: GLOW_BASE_OPACITY + jitter });
            },
          },
          IDLE_START,
        );

        window.__timelines["03-reveal"] = tl;
      </script>
    </template>
  </body>
</html>
