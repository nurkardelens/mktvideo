<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>01 Cold Open</title>
    <!-- head is metadata only for the source file; the runtime discards everything
         outside <template> — see hyperframes-core/references/sub-compositions.md -->
  </head>
  <body>
    <template>
      <style>
        @font-face{font-family:"Archivo Black";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/ArchivoBlack-Regular.woff2") format("woff2");}
        @font-face{font-family:"Space Grotesk";font-weight:400 700;font-style:normal;font-display:block;src:url("assets/fonts/SpaceGrotesk-Variable.woff2") format("woff2");}
        @font-face{font-family:"JetBrains Mono";font-weight:400 500;font-style:normal;font-display:block;src:url("assets/fonts/JetBrainsMono-Variable.woff2") format("woff2");}

        /* Root: styled by #root, never a class — see sub-compositions.md Pitfall 3 */
        #root {
          position: relative;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
        }

        /* Full-bleed ground lives on its own class="clip" layer, never on #root itself —
           the assembler clip-gates #root to its scene window, so a background painted
           there is not a dependable full-frame ground. */
        .void-bg {
          position: absolute;
          inset: 0;
          background: #0b0b0d;
        }

        .point-stage {
          position: absolute;
          inset: 0;
        }

        /* Ambient halo — sits behind the core point, blooms + swells.
           Centered via margin offsets (not transform) so GSAP owns `scale` cleanly. */
        .glow-halo {
          position: absolute;
          left: 50%;
          top: 50%;
          width: 500px;
          height: 500px;
          margin-left: -250px;
          margin-top: -250px;
          border-radius: 50%;
          background: radial-gradient(
            circle,
            rgba(0, 229, 255, 0.9) 0%,
            rgba(0, 229, 255, 0.32) 38%,
            rgba(0, 229, 255, 0) 70%
          );
          opacity: 0.05;
          transform: scale(1);
          transform-origin: 50% 50%;
          will-change: transform, opacity;
        }

        /* The point itself — a single small hot core, stays a POINT (never scales),
           only its brightness climbs. */
        .core-dot {
          position: absolute;
          left: 50%;
          top: 50%;
          width: 40px;
          height: 40px;
          margin-left: -20px;
          margin-top: -20px;
          border-radius: 50%;
          background: radial-gradient(
            circle,
            #ffffff 0%,
            #00e5ff 45%,
            rgba(0, 229, 255, 0) 100%
          );
          opacity: 0.05;
          will-change: opacity;
        }

        /* Single concentric ring pulse — fires once, late, never repeats */
        .ring-pulse {
          position: absolute;
          left: 50%;
          top: 50%;
          width: 60px;
          height: 60px;
          margin-left: -30px;
          margin-top: -30px;
          border-radius: 50%;
          border: 2px solid rgba(0, 229, 255, 0.9);
          opacity: 0;
          transform: scale(1);
          transform-origin: 50% 50%;
          will-change: transform, opacity;
        }
      </style>

      <div id="root" data-composition-id="01-cold-open" data-width="1920" data-height="1080" data-duration="4">
        <div id="void-bg" class="clip void-bg" data-start="0" data-duration="4" data-track-index="0"></div>

        <div id="point-stage" class="clip point-stage" data-start="0" data-duration="4" data-track-index="1">
          <div id="glow-halo" class="glow-halo"></div>
          <div id="ring-pulse" class="ring-pulse"></div>
          <div id="core-dot" class="core-dot"></div>
        </div>
      </div>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        const dot = document.getElementById("core-dot");
        const halo = document.getElementById("glow-halo");
        const ring = document.getElementById("ring-pulse");

        // ── Scene 1 (0.0–2.0s) ──────────────────────────────────────────
        // Near-imperceptible point, dead center. Ambient glow bloom begins:
        // opacity crawls 0.05 → 0.3 on a slow, linear-feeling ramp. No scale
        // change yet — the point stays a point, only its light climbs.
        tl.fromTo(
          halo,
          { opacity: 0.05, scale: 1 },
          { opacity: 0.3, scale: 1, duration: 2, ease: "none" },
          0,
        );
        tl.fromTo(dot, { opacity: 0.05 }, { opacity: 0.3, duration: 2, ease: "none" }, 0);

        // ── Scene 2 (2.0–4.0s) ──────────────────────────────────────────
        // Keeps intensifying: halo blooms further (0.3 → 0.85 opacity,
        // 1.0× → 1.4× scale), point brightens in step. No camera move.
        tl.to(halo, { opacity: 0.85, scale: 1.4, duration: 2, ease: "power1.in" }, 2);
        tl.to(dot, { opacity: 0.85, duration: 2, ease: "power1.in" }, 2);

        // Late in the window: a single low-amplitude concentric ring pulses
        // outward from the point and dissolves — one pulse, not repeating,
        // seeding anticipation ahead of the cut. Two chained tweens keep the
        // ring's scale growing continuously across the whole pulse while its
        // opacity rises then fades (a single fromTo can't rise-then-fall).
        tl.fromTo(
          ring,
          { opacity: 0, scale: 1 },
          { opacity: 0.5, scale: 2.2, duration: 0.35, ease: "power2.out" },
          3.0,
        );
        tl.to(ring, { opacity: 0, scale: 5, duration: 0.55, ease: "power1.out" }, 3.35);

        window.__timelines["01-cold-open"] = tl;
      </script>
    </template>
  </body>
</html>
