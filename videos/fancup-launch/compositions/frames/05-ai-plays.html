<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>05 AI Plays</title>
    <!-- head is metadata only for the source file; the runtime discards everything
         outside <template> — see hyperframes-core/references/sub-compositions.md -->
  </head>
  <body>
    <template>
      <style>
        @font-face{font-family:"Archivo Black";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/ArchivoBlack-Regular.woff2") format("woff2");}
        @font-face{font-family:"Space Grotesk";font-weight:400 700;font-style:normal;font-display:block;src:url("assets/fonts/SpaceGrotesk-Variable.woff2") format("woff2");}
        @font-face{font-family:"JetBrains Mono";font-weight:400 500;font-style:normal;font-display:block;src:url("assets/fonts/JetBrainsMono-Variable.woff2") format("woff2");}

        /* Root: styled by #root, never a class — see sub-compositions.md Pitfall 3 */
        #root {
          position: relative;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
          font-family: "Archivo Black", sans-serif;
        }

        /* Full-bleed ground on its own class="clip" layer, never on #root itself. */
        .ink-bg {
          position: absolute;
          inset: 0;
          background: #0b0b0d;
        }

        .content-stage {
          position: absolute;
          inset: 0;
        }

        /* All content lives inside the top ~83% keep-out; the stack below tops
           out well short of the y=896.4 cutoff. */
        .content-stack {
          position: absolute;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          padding-top: 60px;
        }

        .title {
          margin: 0 0 24px;
          font-family: "Archivo Black", sans-serif;
          font-weight: 400;
          font-size: 88px;
          line-height: 0.92;
          letter-spacing: -0.01em;
          color: #ffffff;
          text-align: center;
          text-transform: uppercase;
        }

        .card-group {
          margin: 0 0 24px;
          display: flex;
          flex-direction: column;
          align-items: center;
          transform-origin: 50% 50%;
          will-change: transform, opacity;
        }

        /* Depth layer 1 — the bordered flat surface frame. No drop shadow, no
           browser chrome: a plain ink-bordered card housing the real screenshot. */
        .card-frame {
          width: 1152px;
          box-sizing: border-box;
          border: 6px solid #ffffff;
          line-height: 0;
        }

        /* Depth layer 2 — the real screenshot, plain <img>, no fake chrome. */
        .card-frame img {
          display: block;
          width: 100%;
          height: auto;
        }

        /* Depth layer 3 — a thin accent shelf beneath the card (echoes the
           accent rule under the wordmark in frame 3), no shadow/blur. */
        .accent-rule {
          margin-top: 10px;
          width: 680px;
          height: 8px;
          background: #00e5ff;
          transform-origin: 50% 50%;
          will-change: transform;
        }

        .subtitle {
          margin: 0;
          font-family: "Archivo Black", sans-serif;
          font-weight: 400;
          font-size: 92px;
          line-height: 0.92;
          letter-spacing: -0.01em;
          color: #00e5ff;
          text-align: center;
          text-transform: uppercase;
          opacity: 0;
          will-change: transform, opacity;
        }
      </style>

      <div
        id="root"
        data-composition-id="05-ai-plays"
        data-width="1920"
        data-height="1080"
        data-duration="4"
      >
        <div id="ink-bg" class="clip ink-bg" data-start="0" data-duration="4" data-track-index="0"></div>

        <div id="content-stage" class="clip content-stage" data-start="0" data-duration="4" data-track-index="1">
          <div class="content-stack">
            <div id="title" class="title">AI PLAYS THE MATCH.</div>

            <div id="card-group" class="card-group">
              <div class="card-frame">
                <img src="assets/match-goal.png" alt="" />
              </div>
              <div id="accent-rule" class="accent-rule"></div>
            </div>

            <div id="subtitle" class="subtitle">YOU CALL IT.</div>
          </div>
        </div>
      </div>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        const title = document.getElementById("title");
        const cardGroup = document.getElementById("card-group");
        const accentRule = document.getElementById("accent-rule");
        const subtitle = document.getElementById("subtitle");

        // ── Scene 1 (0.0–1.2s) ──────────────────────────────────────────
        // "AI PLAYS THE MATCH." fades in centered, upper third. fromTo states
        // the collapsed start explicitly so a seek to t=0 lands there.
        tl.fromTo(
          title,
          { opacity: 0, y: 16 },
          { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" },
          0.15,
        );

        // ── Scene 2 (1.2–2.6s) ──────────────────────────────────────────
        // spring-pop-entrance: the real match-goal screenshot, in its
        // cream-bordered flat card, scale-pops in on a smooth long-tail
        // settle — no overshoot, per this video's no-bounce doctrine.
        tl.fromTo(
          cardGroup,
          { opacity: 0, scale: 0 },
          { opacity: 1, scale: 1, duration: 0.6, ease: "power3.out" },
          1.2,
        );

        // Third depth layer: the accent shelf draws in just after the card
        // settles, still inside the Scene 2 window.
        tl.fromTo(
          accentRule,
          { scaleX: 0, opacity: 0 },
          { scaleX: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
          1.9,
        );

        // ── Scene 3 (2.6–4.0s) ──────────────────────────────────────────
        // discrete-text-sequence: "YOU CALL IT." lands beneath the card as a
        // single hard-cut beat — an instant state jump, no tween between
        // hidden and visible.
        tl.set(subtitle, { opacity: 1 }, 2.6);

        // Holds for the remainder of the frame. Only sanctioned aliveness:
        // a subtle, low-amplitude jitter on the settled subtitle — never a
        // breathing loop. sin(0) = 0 so it starts exactly at the cut's
        // resting position, no jump.
        const jitter = { p: 0 };
        tl.to(
          jitter,
          {
            p: Math.PI * 2 * 1.5,
            duration: 1.4,
            ease: "none",
            onUpdate: () => {
              const y = Math.sin(jitter.p) * 2;
              subtitle.style.transform = `translateY(${y}px)`;
            },
          },
          2.6,
        );

        window.__timelines["05-ai-plays"] = tl;
      </script>
    </template>
  </body>
</html>
