<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>06 Trust Triad</title>
    <!-- head is metadata only for the source file; the runtime discards everything
         outside the template element — see hyperframes-core/references/sub-compositions.md -->
  </head>
  <body>
    <template>
      <style>
        @font-face{font-family:"Archivo Black";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/ArchivoBlack-Regular.woff2") format("woff2");}
        @font-face{font-family:"Space Grotesk";font-weight:400 700;font-style:normal;font-display:block;src:url("assets/fonts/SpaceGrotesk-Variable.woff2") format("woff2");}
        @font-face{font-family:"JetBrains Mono";font-weight:400 500;font-style:normal;font-display:block;src:url("assets/fonts/JetBrainsMono-Variable.woff2") format("woff2");}

        /* Root: styled by #root, never a class — see sub-compositions.md Pitfall 3 */
        #root {
          position: relative;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
          font-family: "Space Grotesk", sans-serif;
        }

        /* Full-bleed ground on its own class="clip" layer, never on #root itself. */
        .ink-ground {
          position: absolute;
          inset: 0;
          background: #0b0b0d;
        }

        /* ── Kicker: "HOW IT WORKS" — mono-kicker token, top-center ── */
        .kicker-stage {
          position: absolute;
          inset: 0;
          display: flex;
          justify-content: center;
        }
        .kicker {
          margin-top: 84px;
          font-family: "JetBrains Mono", monospace;
          font-weight: 400;
          font-size: 24px;
          letter-spacing: 0.14em;
          text-transform: uppercase;
          color: #ffffff;
          opacity: 0;
        }

        /* ── Tile trio ── */
        .tiles-stage {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .glow-surface {
          position: relative;
          width: 1700px;
          height: 220px;
          overflow: hidden;
        }
        .tiles-row {
          position: relative;
          z-index: 1;
          width: 1700px;
          height: 200px;
          margin-top: 10px;
          display: flex;
          align-items: stretch;
          justify-content: center;
          gap: 40px;
        }
        .tile {
          width: 540px;
          box-sizing: border-box;
          border: 3px solid #ffffff;
          padding: 0 36px;
          display: flex;
          align-items: center;
          justify-content: flex-start;
          opacity: 0;
          will-change: transform, opacity;
        }
        .tile-copy {
          font-family: "Archivo Black", sans-serif;
          font-weight: 400;
          font-size: 34px;
          line-height: 1.0;
          letter-spacing: -0.01em;
          text-transform: uppercase;
        }
        .tile-yellow { background: #00e5ff; }
        .tile-yellow .tile-copy { color: #0b0b0d; }
        .tile-orange { background: #e8113c; }
        .tile-orange .tile-copy { color: #ffffff; }
        .tile-cream { background: #ffffff; }
        .tile-cream .tile-copy { color: #0b0b0d; }

        /* Traveling glow sweep — single pass, clipped to the surface */
        .sweep {
          position: absolute;
          top: 0;
          bottom: 0;
          left: 0;
          width: 380px;
          z-index: 2;
          background: linear-gradient(
            100deg,
            rgba(255, 255, 255, 0) 0%,
            rgba(255, 255, 255, 0.55) 50%,
            rgba(255, 255, 255, 0) 100%
          );
          opacity: 0;
          pointer-events: none;
          will-change: transform, opacity;
        }
      </style>

      <div id="root" data-composition-id="06-trust-triad" data-width="1920" data-height="1080" data-duration="5.4">
        <div id="ink-ground" class="clip ink-ground" data-start="0" data-duration="5" data-track-index="0"></div>

        <div id="kicker-clip" class="clip kicker-stage" data-start="0" data-duration="5" data-track-index="1">
          <div id="kicker" class="kicker">HOW IT WORKS</div>
        </div>

        <div id="tiles-clip" class="clip tiles-stage" data-start="0" data-duration="5" data-track-index="2">
          <div id="glow-surface" class="glow-surface">
            <div id="tiles-row" class="tiles-row">
              <div id="tile-1" class="tile tile-yellow">
                <div class="tile-copy">PLAY-MONEY. ZERO REAL-MONEY RISK.</div>
              </div>
              <div id="tile-2" class="tile tile-orange">
                <div class="tile-copy">PROVABLY FAIR &mdash; MAGICBLOCK VRF</div>
              </div>
              <div id="tile-3" class="tile tile-cream">
                <div class="tile-copy">ONE ACCOUNT, TWO CHAINS</div>
              </div>
            </div>
            <div id="sweep" class="sweep"></div>
          </div>
        </div>
      </div>

      <script src="assets/vendor/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        const kicker = document.getElementById("kicker");
        const tile1 = document.getElementById("tile-1");
        const tile2 = document.getElementById("tile-2");
        const tile3 = document.getElementById("tile-3");
        const sweep = document.getElementById("sweep");

        // ── Scene 1 (0.0–1.2s) ────────────────────────────────────────────
        // Mono kicker "HOW IT WORKS" fades in top-center; the three-tile
        // region establishes empty (tiles start at opacity 0, no motion yet).
        tl.fromTo(
          kicker,
          { opacity: 0, y: 16 },
          { opacity: 1, y: 0, duration: 0.9, ease: "power3.out" },
          0.2,
        );

        // ── Scene 2 (1.2–3.2s) ───────────────────────────────────────────
        // Three cream-bordered tiles self-ASSEMBLE left-to-right in a
        // staggered cascade (~0.3s gap), short-path directly into their
        // flex slot — no scatter, no bounce, power3 settle only.
        tl.fromTo(
          tile1,
          { opacity: 0, y: 26, scale: 0.94 },
          { opacity: 1, y: 0, scale: 1, duration: 0.85, ease: "power3.out" },
          1.2,
        );
        tl.fromTo(
          tile2,
          { opacity: 0, y: 26, scale: 0.94 },
          { opacity: 1, y: 0, scale: 1, duration: 0.85, ease: "power3.out" },
          1.5,
        );
        tl.fromTo(
          tile3,
          { opacity: 0, y: 26, scale: 0.94 },
          { opacity: 1, y: 0, scale: 1, duration: 0.85, ease: "power3.out" },
          1.8,
        );

        // ── Scene 3 (3.2–5.0s) ───────────────────────────────────────────
        // Array resolves and holds near-static. One traveling-glow sweep
        // (ambient-glow-bloom, single pass) crosses left-to-right across
        // the three tiles and settles — no repeat, no loop. Two adjacent
        // (non-overlapping) tweens: fade-in-while-traveling, then
        // fade-out-while-traveling, so x keeps moving continuously across
        // the whole pass while opacity rises then falls.
        tl.fromTo(
          sweep,
          { x: -440, opacity: 0 },
          { x: 660, opacity: 0.28, duration: 0.55, ease: "none" },
          3.3,
        );
        tl.to(sweep, { x: 1760, opacity: 0, duration: 0.55, ease: "none" }, 3.85);

        // Subtle jitter only for the remainder — NOT a breathing loop.
        // Bounded sine-driven onUpdate (sine-wave-loop), amplitude scaled
        // /√3 for three concurrent tiles, phases offset so they don't
        // move in lockstep.
        const tiles = [tile1, tile2, tile3];
        const phase = { p: 0 };
        const Y_AMP = 1.5;
        const SCALE_AMP = 0.006;
        const PHASE_OFFSETS = [0, Math.PI / 3, (2 * Math.PI) / 3];
        tl.to(
          phase,
          {
            p: Math.PI * 2,
            duration: 2.2,
            ease: "none",
            onUpdate: () => {
              tiles.forEach((el, i) => {
                const s = Math.sin(phase.p + PHASE_OFFSETS[i]);
                gsap.set(el, { y: s * Y_AMP, scale: 1 + s * SCALE_AMP });
              });
            },
          },
          2.8,
        );

        window.__timelines["06-trust-triad"] = tl;
      </script>
    </template>
  </body>
</html>
