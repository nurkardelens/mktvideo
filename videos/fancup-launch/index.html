<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #FFFFFF;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="30"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-01-cold-open"
        class="scene"
        data-composition-id="01-cold-open"
        data-composition-src="compositions/frames/01-cold-open.html"
        data-start="0"
        data-duration="4"
        data-track-index="0"
      ></div>

      <div
        id="el-02-escalation"
        class="scene"
        data-composition-id="02-escalation"
        data-composition-src="compositions/frames/02-escalation.html"
        data-start="4"
        data-duration="3.4"
        data-track-index="1"
      ></div>

      <div
        id="el-03-reveal"
        class="scene"
        data-composition-id="03-reveal"
        data-composition-src="compositions/frames/03-reveal.html"
        data-start="7"
        data-duration="5.5"
        data-track-index="0"
      ></div>

      <div
        id="el-04-collision"
        class="scene"
        data-composition-id="04-collision"
        data-composition-src="compositions/frames/04-collision.html"
        data-start="12"
        data-duration="5.5"
        data-track-index="1"
      ></div>

      <div
        id="el-05-kickoff-tease"
        class="scene"
        data-composition-id="05-kickoff-tease"
        data-composition-src="compositions/frames/05-kickoff-tease.html"
        data-start="17"
        data-duration="5.4"
        data-track-index="0"
      ></div>

      <div
        id="el-06-waitlist-close"
        class="scene"
        data-composition-id="06-waitlist-close"
        data-composition-src="compositions/frames/06-waitlist-close.html"
        data-start="22"
        data-duration="8"
        data-track-index="1"
      ></div>

      <!-- SFX -->
      <audio
        id="el-sfx-0"
        src="assets/sfx/riser.mp3"
        data-start="0"
        data-duration="10.03"
        data-track-index="20"
        data-volume="0.35"
      ></audio>
      <audio
        id="el-sfx-1"
        src="assets/sfx/glitch-2.mp3"
        data-start="4"
        data-duration="3.5"
        data-track-index="21"
        data-volume="0.35"
      ></audio>
      <audio
        id="el-sfx-2"
        src="assets/sfx/impact-bass-1.mp3"
        data-start="7"
        data-duration="2.12"
        data-track-index="22"
        data-volume="0.35"
      ></audio>
      <audio
        id="el-sfx-3"
        src="assets/sfx/sparkle.mp3"
        data-start="7"
        data-duration="1.8"
        data-track-index="23"
        data-volume="0.35"
      ></audio>
      <audio
        id="el-sfx-4"
        src="assets/sfx/chime.mp3"
        data-start="7"
        data-duration="2.5"
        data-track-index="24"
        data-volume="0.35"
      ></audio>
      <audio
        id="el-sfx-5"
        src="assets/sfx/whoosh-short.mp3"
        data-start="12"
        data-duration="0.57"
        data-track-index="25"
        data-volume="0.35"
      ></audio>
      <audio
        id="el-sfx-6"
        src="assets/sfx/whoosh-cinematic.mp3"
        data-start="17"
        data-duration="5.54"
        data-track-index="26"
        data-volume="0.35"
      ></audio>
      <audio
        id="el-sfx-7"
        src="assets/sfx/whoosh-cinematic.mp3"
        data-start="22"
        data-duration="5.54"
        data-track-index="27"
        data-volume="0.35"
      ></audio>
      <audio
        id="el-sfx-8"
        src="assets/sfx/chime.mp3"
        data-start="22"
        data-duration="2.5"
        data-track-index="28"
        data-volume="0.35"
      ></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-02-escalation", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 7);
        tl.fromTo("#el-03-reveal", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 7);
        tl.to("#el-03-reveal", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 12);
        tl.fromTo("#el-04-collision", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 12);
        tl.to("#el-04-collision", { x: -1920, duration: 0.5, ease: "power3.inOut" }, 17);
        tl.fromTo("#el-05-kickoff-tease", { x: 1920, opacity: 1 }, { x: 0, duration: 0.5, ease: "power3.inOut" }, 17);
        tl.to("#el-05-kickoff-tease", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 22);
        tl.fromTo("#el-06-waitlist-close", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 22);
        tl.to({}, { duration: 30 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
